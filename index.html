<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RXN KAGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>RXN KAGE</title>
<style>
/* =========================================================
   RXN KAGE · App de entrenamiento (PWA, funciona sin internet)
   Todo el código está en este archivo. Los datos se guardan
   en el propio celular (localStorage + IndexedDB para música).
   ========================================================= */
:root{
  --bg:#0E1220; --card:#161B2D; --card2:#1D2338; --line:#2A3150;
  --tx:#EEF0F6; --mut:#98A1BC; --or:#F26B1D; --or2:#FF8A3D;
  --te:#2A9D8F; --gr:#2FAE66; --am:#F2A541; --rd:#E5484D; --pu:#7C5CF0; --bl:#3B7BF6;
  --r:14px; --nav:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 150px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.sm{font-size:13px}.xs{font-size:12px}.mut{color:var(--mut)}.b{font-weight:700}.c{text-align:center}
.hidden{display:none!important}

/* ---------- cabecera ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(14,18,32,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo svg{width:24px;height:24px}
.hdr-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px}
.icon-btn.on{border-color:var(--or);color:var(--or2)}

main{max-width:640px;margin:0 auto;padding:14px 16px 8px}

/* ---------- navegación inferior ---------- */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(14,18,32,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav#nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;position:relative}
nav#nav button span{font-size:20px;line-height:1}
nav#nav button.act{color:var(--or2)}
nav#nav button .dot{position:absolute;top:9px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--or)}

/* ---------- tarjetas y botones ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.hl{border-color:rgba(242,107,29,.55);background:linear-gradient(160deg,#22192A 0%,var(--card) 60%)}
.card h2{font-size:17px;margin-bottom:6px}
.card h3{font-size:15px;margin-bottom:4px}
.kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--or2);font-weight:700}
.row{display:flex;align-items:center;gap:8px}.row.sb{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack>*+*{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:0;
  background:var(--or);color:#fff;font-weight:700;letter-spacing:.01em}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rd);border:1px solid rgba(229,72,77,.5)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.or{background:rgba(242,107,29,.15);border-color:rgba(242,107,29,.5);color:var(--or2)}
.chip.te{background:rgba(42,157,143,.15);border-color:rgba(42,157,143,.5);color:#6FD3C5}
.chip.bl{background:rgba(59,123,246,.15);border-color:rgba(59,123,246,.5);color:#8DB2FF}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sel-chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px}
.sel-chip.on{background:var(--or);border-color:var(--or);color:#fff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* interruptor */
.sw{position:relative;display:inline-block;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:30px;background:#394063;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--or)}
.sw input:checked+i::after{transform:translateX(20px)}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-line:last-child{border-bottom:0}
.set-line label:not(.sw){flex:1;min-width:0}
.set-line>select,.set-line>input{max-width:58%;min-width:0;text-overflow:ellipsis}
.mbar{position:sticky;bottom:0;background:var(--card);padding:12px 0 2px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:2}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
.inp:focus{outline:2px solid rgba(242,107,29,.6);border-color:transparent}
.inp.n{width:84px;text-align:center}
textarea.inp{min-height:70px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:20px;line-height:1}
.stepper output{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- hoy ---------- */
.hero-t{font-size:26px;font-weight:800;margin:4px 0 2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd{text-align:center;font-size:12px;color:var(--mut)}
.wd b{display:grid;place-items:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;border:1px dashed var(--line);font-size:14px;color:var(--mut)}
.wd.done b{background:var(--or);border:0;color:#fff}
.wd.today b{border:2px solid var(--or2)}
.rank{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.stars{color:var(--or2);letter-spacing:2px}

/* ---------- sesión ---------- */
.steps{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13.5px;font-weight:600}
.steps button.on{background:var(--or);color:#fff;border-color:var(--or)}
.steps button.ok{color:#7FDDAA;border-color:rgba(47,174,102,.5)}
.ses-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ses-head .t{font-size:20px;font-weight:800}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--or2);font-size:15px}
.navbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.blk-h{margin:16px 2px 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--or2);font-weight:700}

.ej .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ej .nm{font-weight:700;font-size:16px}
.ej .cnt{font-size:13px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.ej.done{border-color:rgba(47,174,102,.55)}
.ej.done .cnt{color:#7FDDAA}
.sug{margin:9px 0 6px;padding:8px 10px;border-radius:10px;font-size:13.5px;line-height:1.35;background:var(--card2);border-left:3px solid var(--mut)}
.sug.subir{border-left-color:var(--gr);background:rgba(47,174,102,.1)}
.sug.casi{border-left-color:var(--am);background:rgba(242,165,65,.1)}
.sug.bajar{border-left-color:var(--rd);background:rgba(229,72,77,.1)}
.sug.info{border-left-color:var(--bl);background:rgba(59,123,246,.1)}
details{margin:4px 0}
details summary{font-size:13px;color:var(--mut);cursor:pointer;list-style:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
details p{margin:6px 0 0;font-size:14px}
.sets{margin-top:8px}
.srow{display:grid;grid-template-columns:20px 1fr 62px 56px 44px;gap:6px;align-items:center;padding:5px 0}
.srow.hd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:0}
.srow .n{font-weight:700;color:var(--mut);text-align:center}
.srow .vw{display:flex;gap:4px}
.srow input,.srow select{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:42px;width:100%;text-align:center;padding:4px;font-variant-numeric:tabular-nums}
.srow select{padding:4px 2px;text-align-last:center}
.srow .cr{flex:none;width:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:16px}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:19px;color:var(--mut)}
.srow.ok .chk{background:var(--gr);border-color:var(--gr);color:#fff}
.srow.ok input,.srow.ok select{border-color:rgba(47,174,102,.45)}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:0}
.check-item input{width:24px;height:24px;accent-color:var(--or);flex:none}
.combo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.combo{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:left}
.combo b{display:block;font-size:17px;letter-spacing:.04em}
.combo span{font-size:12px;color:var(--mut)}
.combo.on{border-color:var(--or);background:rgba(242,107,29,.14)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:14px;padding:0}
.rpe button.on{background:var(--or);border-color:var(--or);color:#fff}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{height:66px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.moods button small{font-size:10.5px;color:var(--mut);margin-top:2px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mut)}
.pr{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}

/* ---------- historial ---------- */
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.hist .d{font-weight:700}
.mes{margin:16px 2px 8px;color:var(--mut);font-size:13px;text-transform:capitalize;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--mut);font-weight:600}
.tbl td input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center}

/* ---------- gráficas ---------- */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mut);font-size:10px;font-family:inherit}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- figuras de ejercicios ---------- */
:root{--fn:#EEF0F6;--ff:#6F7898;--fa:#F26B1D;--fa2:#B4581F;--fp:#3A4263;--fd:#F2A541}
.fig{display:block}
.fig line{stroke-linecap:round;stroke-linejoin:round}
.fig .n{stroke:var(--fn);stroke-width:6}.fig .f{stroke:var(--ff);stroke-width:5.5}
.fig .an{stroke:var(--fa);stroke-width:6}.fig .af{stroke:var(--fa2);stroke-width:5.5}
.fig .tr{stroke-width:9}.fig .tf{stroke-width:12}.fig .hd{fill:var(--fn)}
.fig .pr{stroke:var(--fp);stroke-width:2}.fig .br{stroke:#C9CEDD;stroke-width:3}
.fig .mat{fill:var(--fp);opacity:.5}.fig .bag{fill:none;stroke:var(--fp);stroke-width:2.5}
.fig .dbh{stroke:var(--fd);stroke-width:2.5}.fig .db{fill:var(--fd)}
.fig .fx,.fig .fxs{stroke:var(--fa);stroke-width:2;fill:none;stroke-linecap:round}
.fig.ej-fig{width:100%;height:132px;background:var(--card2);border-radius:12px;margin:10px 0 2px}
.fig.mini{width:68px;height:46px;flex:none;background:var(--card2);border-radius:9px}
.fig.cmb{width:100%;height:58px;margin-top:6px;background:rgba(0,0,0,.18);border-radius:8px}
.golpes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.golpes div{background:var(--card2);border-radius:10px;padding:4px 4px 6px;text-align:center;font-size:12px}
.golpes .fig{width:100%;height:62px}
#timer{--fn:#fff;--ff:rgba(255,255,255,.55);--fa:#fff;--fa2:rgba(255,255,255,.6);--fp:rgba(255,255,255,.35);--fd:#FFE2B8}
#timer .fig .br{stroke:rgba(255,255,255,.75)}
.tm-fig{width:min(86vw,400px);height:min(27vh,220px)}
#timer.con-fig .tm-reloj{font-size:min(22vw,110px)}
#timer.con-fig .tm-combo{font-size:min(11vw,52px);margin-top:2px}

/* ---------- dock (descanso, cronómetro, música) ---------- */
#dock{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;gap:6px;padding:0 10px 8px;pointer-events:none}
#dock>*{pointer-events:auto;max-width:620px;margin:0 auto;width:100%}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#22283F;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bar .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:72px}
.bar .txt{flex:1;min-width:0;font-size:13px;line-height:1.3}
.bar .txt .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:13px;padding:0 8px}
.bar.rest{background:linear-gradient(90deg,#3A1F28,#22283F)}
.bar.go{background:linear-gradient(90deg,#16402B,#22283F);border-color:rgba(47,174,102,.6)}
.bar.crono{background:linear-gradient(90deg,#16303A,#22283F)}
.bar.music{padding:7px 10px}
.bar.music .big{font-size:18px;min-width:0}
.prog{position:relative;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:5px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--or)}

/* ---------- temporizador a pantalla completa ---------- */
#timer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 18px);background:#18305F;transition:background .35s;color:#fff}
#timer[data-e="prep"]{background:#1E3A78}
#timer[data-e="work"]{background:#167A45}
#timer[data-e="warn"]{background:#B9741A}
#timer[data-e="rest"]{background:#9E2A33}
#timer[data-e="rafaga"]{background:#E0601B;animation:flash .5s infinite alternate}
#timer[data-e="desahogo"]{background:#5A3CC4}
#timer[data-e="respira"]{background:#1F7F75}
#timer[data-e="emom"]{background:#1C5B6E}
#timer[data-e="manual"]{background:#2B3A66}
#timer[data-e="fin"]{background:#11182C}
@keyframes flash{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.tm-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tm-top button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.22);color:#fff;font-size:18px}
.tm-tit{flex:1;font-weight:700;font-size:15px;opacity:.95}
.tm-ronda{font-weight:700;font-size:15px;min-width:42px;opacity:.95}
.tm-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:6px}
.tm-estado{font-size:22px;font-weight:800;letter-spacing:.16em}
.tm-reloj{font-size:min(30vw,150px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm-bar{width:min(100%,520px);height:8px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden}
.tm-bar i{display:block;height:100%;width:0;background:rgba(255,255,255,.9)}
.tm-combo{font-size:min(14vw,64px);font-weight:800;min-height:1.2em;letter-spacing:.04em;margin-top:8px}
.tm-combo-n{font-size:16px;opacity:.92;min-height:1.4em}
.tm-info{font-size:17px;opacity:.95;max-width:520px;min-height:1.4em}
.tm-resp{width:170px;height:170px;display:grid;place-items:center}
.tm-resp i{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);transform:scale(var(--s,.55));transition:transform .3s linear}
.tm-ctl{display:flex;gap:10px;width:100%;max-width:520px}
.tm-ctl button{flex:1;min-height:56px;border-radius:14px;border:0;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:16px}
.tm-ctl button.hecho{background:#fff;color:#111;flex:2}
.tm-mus{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;opacity:.95}
.tm-mus button{width:40px;height:36px;border-radius:10px;border:0;background:rgba(0,0,0,.22);color:#fff}

/* ---------- modal y avisos ---------- */
#modal{position:fixed;inset:0;z-index:70;background:rgba(5,8,16,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#modal .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#modal h2{font-size:18px;margin-bottom:10px}
#modal label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%) translateY(-20px);opacity:0;z-index:80;

<script>
/* =========================================================
   FIGURAS ANIMADAS DE LOS EJERCICIOS
   Un muñeco dibujado con SVG (de perfil o de frente). Cada
   ejercicio se define con 2 o más posturas clave y se anima en
   bucle. Brazos y piernas se calculan con cinemática inversa:
   basta con decir dónde van manos, pies, cadera y tronco.
   Naranja = zona que trabaja.
   ========================================================= */
const Fig = (() => {
  const L = { tor: 27, cue: 3, cab: 6, bra: 14.5, ant: 14, mus: 20, pie: 19.5 };
  const G = 100, BY = 8, W = 160, H = 104;
  const R = d => d * Math.PI / 180, D = r => r * 180 / Math.PI;
  const pt = (p, l, a) => [p[0] + l * Math.cos(R(a)), p[1] - l * Math.sin(R(a))];
  const ang = (a, b) => D(Math.atan2(-(b[1] - a[1]), b[0] - a[0]));
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);

  function ik(s, t, l1, l2, lado) {
    const d = dist(s, t), base = ang(s, t);
    const dd = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.01);
    const c = (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd);
    const j = pt(s, l1, base + lado * D(Math.acos(Math.min(1, Math.max(-1, c)))));
    return [j, d > l1 + l2 - 0.01 ? pt(j, l2, ang(j, t)) : t];
  }

  /* ---------- dibujo ---------- */
  const f1 = n => n.toFixed(1);
  const ln = (a, b, cls) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${cls}"/>`;
  function props(p = {}) {
    let s = '';
    if (p.esterilla) s += `<rect x="14" y="${G - 1}" width="132" height="3" rx="1.5" class="mat"/>`;
    if (p.suelo !== false) s += `<line x1="-60" y1="${G + 2}" x2="220" y2="${G + 2}" class="pr sl"/>`;
    if (p.barra) s += `<line x1="46" y1="0" x2="46" y2="${BY + 7}" class="pr"/><line x1="118" y1="0" x2="118" y2="${BY + 7}" class="pr"/><line x1="44" y1="${BY}" x2="120" y2="${BY}" class="br"/>`;
    if (p.barraF) s += `<line x1="40" y1="0" x2="40" y2="${BY + 7}" class="pr"/><line x1="120" y1="0" x2="120" y2="${BY + 7}" class="pr"/><line x1="38" y1="${BY}" x2="122" y2="${BY}" class="br"/>`;
    if (p.pared != null) s += `<line x1="${p.pared}" y1="6" x2="${p.pared}" y2="${G + 2}" class="pr"/>`;
    if (p.saco) s += `<line x1="123" y1="0" x2="123" y2="7" class="pr"/><rect x="113" y="7" width="20" height="62" rx="8" class="bag"/>`;
    if (p.caja) s += `<rect x="28" y="80" width="22" height="22" rx="2" class="bag"/>`;
    if (p.giro) s += `<path d="M44 62 q16 -14 32 0" class="fxs"/><path d="M73 57 l4 5 l-6 1" class="fxs"/>`;
    return s;
  }
  function dibujar(P, S) {
    const fr = S.v === 'frente', fo = S.foco || [], sy = P.sy || 0;
    const hip = P.c, sh = pt(hip, L.tor, P.t), hd = pt(sh, L.cue + L.cab * 0.8, P.t + (P.h || 0));
    const shN = fr ? [sh[0] + 7.5, sh[1] + 1.5 + sy] : sh, shF = fr ? [sh[0] - 7.5, sh[1] + 1.5 + sy] : sh;
    const hpN = fr ? [hip[0] + 4.5, hip[1]] : hip, hpF = fr ? [hip[0] - 4.5, hip[1]] : hip;
    const e = P.e || [-1, -1], k = P.k || [1, 1];
    const [elN, haN] = ik(shN, P.mn, L.bra, L.ant, e[0]), [elF, haF] = ik(shF, P.mf, L.bra, L.ant, e[1]);
    const [knN, anN] = ik(hpN, P.pn, L.mus, L.pie, k[0]), [knF, anF] = ik(hpF, P.pf, L.mus, L.pie, k[1]);
    const pie = (kn, an, lado) => fr ? pt(an, 4, lado ? -15 : -165) : pt(an, 5.5, ang(kn, an) + 90);
    const c = (parte, lado) => (fo.includes(parte) ? 'a' : '') + lado;
    let s = props(S.p);
    // lado lejano (oscuro) en vista de perfil
    const cf = fr ? 'n' : 'f';
    s += ln(hpF, knF, c('piernas', cf)) + ln(knF, anF, c('piernas', cf)) + ln(anF, pie(knF, anF, 0), c('piernas', cf));
    if (!fr) s += ln(shF, elF, c('brazos', 'f')) + ln(elF, haF, c('brazos', 'f'));
    // tronco y cabeza
    if (fr) s += ln(hip, [sh[0], sh[1] + 2], c('torso', 'n') + ' tf') + ln(shN, shF, c('torso', 'n')) + ln(hpN, hpF, c('torso', 'n'));
    else s += ln(hip, sh, c('torso', 'n') + ' tr');
    s += `<circle cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="${L.cab}" class="hd"/>`;
    // lado cercano
    s += ln(hpN, knN, c('piernas', 'n')) + ln(knN, anN, c('piernas', 'n')) + ln(anN, pie(knN, anN, 1), c('piernas', 'n'));
    if (fr) s += ln(shF, elF, c('brazos', 'n')) + ln(elF, haF, c('brazos', 'n'));
    s += ln(shN, elN, c('brazos', 'n')) + ln(elN, haN, c('brazos', 'n'));
    // mancuernas
    for (const [lado, el, ha] of [['n', elN, haN], ['f', elF, haF]]) {
      if (!(S.db || []).includes(lado)) continue;
      const a = ang(el, ha) + 90, p1 = pt(ha, 5, a), p2 = pt(ha, -5, a);
      s += ln(p1, p2, 'dbh') + `<circle cx="${f1(p1[0])}" cy="${f1(p1[1])}" r="3" class="db"/><circle cx="${f1(p2[0])}" cy="${f1(p2[1])}" r="3" class="db"/>`;
    }
    // efecto del golpe
    if (P.g && P.fo > 0.05) {
      const m = P.g === 'n' ? haN : haF, o = Math.min(1, P.fo).toFixed(2);
      if (P.tg === 'gancho') s += `<path d="M${f1(m[0] - 14)} ${f1(m[1] + 9)} q8 -14 16 -9" class="fx" opacity="${o}"/>`;
      else if (P.tg === 'upper') s += `<path d="M${f1(m[0] - 6)} ${f1(m[1] + 18)} q-2 -12 6 -16" class="fx" opacity="${o}"/>`;
      else s += [-3, 0, 3].map(dy => `<line x1="${f1(m[0] - 20)}" y1="${f1(m[1] + dy)}" x2="${f1(m[0] - 8)}" y2="${f1(m[1] + dy)}" class="fx" opacity="${o}"/>`).join('');
    }
    return s;
  }

  /* ---------- animación ---------- */
  const ease = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  function mezclar(a, b, k) {
    const o = {};
    for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
      const x = a[key] ?? b[key], y = b[key] ?? a[key];
      if (typeof x === 'number') o[key] = x + (y - x) * k;
      else if (Array.isArray(x) && key !== 'e' && key !== 'k') o[key] = x.map((v, i) => v + (y[i] - v) * k);
      else o[key] = k < 0.5 ? x : y;
    }
    if (a.fo == null && b.fo != null) o.fo = b.fo * k;
    if (b.fo == null && a.fo != null) o.fo = a.fo * (1 - k);
    o.g = b.g || a.g; o.tg = b.tg || a.tg;
    return o;
  }
  function poseEn(S, ms) {
    const F = S.f; if (F.length === 1) return F[0].p;
    const tot = S._tot || (S._tot = F.reduce((a, f) => a + f.d + (f.h || 0), 0));
    let t = ms % tot;
    for (let i = 0; i < F.length; i++) {
      const f = F[i], prev = F[(i - 1 + F.length) % F.length];
      if (t < f.d) return mezclar(prev.p, f.p, ease(t / f.d));
      t -= f.d; if (t < (f.h || 0)) return f.p; t -= f.h || 0;
    }
    return F[0].p;
  }

  /* ---------- posturas base ---------- */
  const X = (o, extra) => Object.assign({}, o, extra);
  // de pie, de perfil, mirando a la derecha
  const pie_ = (o = {}) => X({ c: [78, 60], t: 90, mn: [80, 61], mf: [77, 61], pn: [81, 99], pf: [75, 99], e: [-1, -1], k: [1, 1] }, o);
  // de pie, de frente
  const frente = (o = {}) => X({ c: [80, 60], t: 90, mn: [91, 60], mf: [69, 60], pn: [85, 99], pf: [75, 99], e: [1, -1], k: [1, -1] }, o);
  // colgado de la barra, de perfil (shY = altura de hombros)
  function colgado(shY, o = {}) {
    const t = o.t ?? 95, sh = [79, shY], c = [sh[0] - L.tor * Math.cos(R(t)), sh[1] + L.tor * Math.sin(R(t))];
    return X({ c, t, mn: [83, BY + 1.5], mf: [81, BY + 1.5], pn: [c[0] - 4, c[1] + 37], pf: [c[0] - 8, c[1] + 36], e: [-1, -1], k: [1, 1] }, o);
  }
  // colgado de frente, agarre ancho
  function colgadoF(shY, x = 80, o = {}) {
    const c = [x, shY + L.tor];
    return X({ c, t: 90, mn: [99, BY + 1.5], mf: [61, BY + 1.5], pn: [x + 3, c[1] + 38], pf: [x - 3, c[1] + 38], e: [-1, 1], k: [1, -1] }, o);
  }
  // flexión: cuerpo recto de pies a hombros
  function flex(shY, o = {}) {
    const pies = o.pies || [36, 98], sh = [o.shx ?? 97, shY], dir = ang(pies, sh), c = pt(pies, 40, dir);
    return X({ c, t: ang(c, sh), mn: [101, 99], mf: [99, 99], pn: pies, pf: [pies[0] - 2, pies[1]], e: [-1, -1], k: [1, 1] }, o);
  }
  function pike(abajo, o = {}) {
    const c = abajo ? [72, 63] : [69, 62], sh = abajo ? [96, 86] : [97, 72];
    return X({ c, t: ang(c, sh), mn: [101, 99], mf: [99, 99], pn: [50, 98], pf: [48, 98], e: [-1, -1], k: [1, 1] }, o);
  }
  // tumbado boca arriba, cabeza a la derecha
  const supino = (o = {}) => X({ c: [60, 95], t: 2, mn: [66, 97], mf: [64, 97], pn: [21, 96], pf: [22, 96], e: [1, 1], k: [-1, -1] }, o);
  // inclinado (remos), cadera atrás
  const incl = (o = {}) => X({ c: [64, 62], t: 28, mn: [89, 77], mf: [87, 77], pn: [70, 99], pf: [62, 99], e: [-1, -1], k: [1, 1] }, o);
  // cuadrupedia
  const cuadru = (o = {}) => X({ c: [64, 74], t: 4, mn: [93, 99], mf: [91, 99], pn: [44, 98], pf: [42, 98], e: [1, 1], k: [1, 1] }, o);
  // parada de manos contra la pared
  const vertical = (o = {}) => X({ c: [100, 42], t: -90, mn: [102, 99], mf: [98, 99], pn: [104, 3], pf: [102, 3], e: [1, -1], k: [1, 1] }, o);
  // guardia de boxeo (ortodoxa: la mano y el pie de atrás son los cercanos)
  const guardia = (o = {}) => X({ c: [64, 61], t: 86, mn: [75, 32], mf: [78, 29], pn: [54, 99], pf: [77, 99], e: [-1, -1], k: [1, 1] }, o);

  // utilidades de fotogramas
  const fr = (p, d = 900, h = 300) => ({ p, d, h });
  const ab = (A, B, dB = 900, hB = 300, dA = 1000, hA = 300) => [fr(A, dA, hA), fr(B, dB, hB)];

  /* ---------- biblioteca ---------- */
  const BARRA = { barra: 1, suelo: false }, SUELO = {}, MAT = { esterilla: 1 };
  const plancha = (shY = 84) => { const pies = [22, 98], sh = [92, shY], c = pt(pies, 40, ang(pies, sh)); return { c, t: ang(c, sh), mn: [106, 98], mf: [104, 98], pn: pies, pf: [20, 98], e: [-1, -1], k: [1, 1] }; };
  const tabla = (o = {}) => supino(X({ t: 4, mn: [89, 66], mf: [87, 66], pn: [41, 75], pf: [43, 75], e: [1, 1], k: [-1, -1] }, o));
  const hollow = (o = {}) => supino(X({ c: [62, 94], t: 10, mn: [122, 81], mf: [121, 82], pn: [24, 84], pf: [25, 84] }, o));
  const LIB = {
    // ---- barra ----
    dominadas_pronadas: { p: BARRA, foco: ['brazos'], f: ab(colgado(37), colgado(15), 900, 400, 1200, 400) },
    supinadas_negativa: { p: BARRA, foco: ['brazos'], f: ab(colgado(37), colgado(15), 700, 300, 3600, 300) },
    dominadas_rapidas: { p: BARRA, foco: ['brazos'], f: ab(colgado(37), colgado(14), 420, 250, 1100, 500) },
    dominadas_arquero: { v: 'frente', p: { barraF: 1, suelo: false }, foco: ['brazos'], f: [fr(colgadoF(33), 900, 300), fr(colgadoF(18, 91), 1000, 400), fr(colgadoF(33), 1000, 300), fr(colgadoF(18, 69), 1000, 400)] },
    dominadas_anchas: { v: 'frente', p: { barraF: 1, suelo: false }, foco: ['brazos'], f: ab(colgadoF(33), colgadoF(17), 900, 300, 1200, 300) },
    typewriter: { v: 'frente', p: { barraF: 1, suelo: false }, foco: ['brazos'], f: [fr(colgadoF(17), 800, 200), fr(colgadoF(18, 92), 1300, 300), fr(colgadoF(18, 68), 2200, 300)] },
    isometrica_90: { p: BARRA, foco: ['brazos'], f: [fr(colgado(25), 1, 0)] },
    encogimientos_escap: { p: BARRA, foco: ['torso'], f: ab(colgado(38.5), colgado(34.5), 600, 400, 700, 300) },
    colgado_activo: { p: BARRA, foco: ['brazos'], f: [fr(colgado(36), 1, 0)] },
    elevaciones_colgado: { p: BARRA, foco: ['torso', 'piernas'], f: ab(colgado(36), colgado(36, { pn: [101, 82], pf: [99, 82] }), 1000, 400, 1300, 300) },
    // ---- empuje ----
    flexiones_pike: { p: SUELO, foco: ['brazos'], f: ab(pike(false), pike(true), 1200, 200, 900, 300) },
    pike_pausa: { p: SUELO, foco: ['brazos'], f: ab(pike(false), pike(true), 1200, 2000, 900, 300) },
    pseudo_planche: { p: SUELO, foco: ['brazos'], f: ab(flex(72, { shx: 96, mn: [83, 99], mf: [81, 99] }), flex(87, { shx: 95, mn: [83, 99], mf: [81, 99] }), 1200, 200, 900, 300) },
    flexiones_arquero: { p: SUELO, foco: ['brazos'], f: ab(flex(70), flex(87), 1100, 200, 900, 300) },
    flexiones_palmada: { p: SUELO, foco: ['brazos'], f: [fr(flex(87), 900, 100), fr(flex(62, { mn: [100, 90], mf: [98, 90] }), 220, 140), fr(flex(70), 220, 400)] },
    flexiones_tempo: { p: SUELO, foco: ['brazos'], f: ab(flex(70), flex(87), 4000, 1000, 1000, 300) },
    diamante: { p: SUELO, foco: ['brazos'], f: ab(flex(70, { mn: [95, 99], mf: [94, 99] }), flex(86, { mn: [95, 99], mf: [94, 99] }), 1100, 200, 900, 300) },
    flexiones_protraccion: { p: SUELO, foco: ['torso'], f: ab(flex(72), flex(68), 600, 300, 600, 300) },
    handstand_pared: { p: { pared: 108 }, foco: ['brazos', 'torso'], f: [fr(vertical(), 1, 0)] },
    handstand_toques: { p: { pared: 108 }, foco: ['brazos', 'torso'], f: [fr(vertical(), 500, 300), fr(vertical({ mn: [103, 73] }), 500, 300), fr(vertical(), 500, 300), fr(vertical({ mf: [99, 73] }), 500, 300)] },
    press_unilateral: { db: ['n'], foco: ['brazos'], f: ab(pie_({ mn: [86, 31] }), pie_({ mn: [80, 3] }), 900, 300, 1500, 300) },
    triceps_overhead: { db: ['n'], foco: ['brazos'], f: ab(pie_({ mn: [69, 25], mf: [69, 26], e: [-1, -1] }), pie_({ mn: [80, 3], mf: [79, 3] }), 900, 300, 1200, 300) },
    laterales: { v: 'frente', db: ['n', 'f'], foco: ['brazos'], f: ab(frente(), frente({ mn: [116, 34], mf: [44, 34] }), 900, 300, 1200, 300) },
    // ---- tirón con mancuernas ----
    remo_unilateral: { p: { pared: 114 }, db: ['n'], foco: ['brazos', 'torso'], f: ab(incl({ mf: [113, 44] }), incl({ mf: [113, 44], mn: [77, 61] }), 800, 600, 1100, 300) },
    pajaros: { db: ['n', 'f'], foco: ['brazos'], f: ab(incl({ t: 32 }), incl({ t: 32, mn: [92, 57], mf: [90, 57] }), 900, 300, 1200, 300) },
    curl_supino: { db: ['n', 'f'], foco: ['brazos'], f: ab(pie_({ mn: [79, 61.5], mf: [77, 61.5] }), pie_({ mn: [83, 35], mf: [81, 36] }), 900, 300, 1200, 300) },
    curl_martillo: { db: ['n', 'f'], foco: ['brazos'], f: ab(pie_({ mn: [79, 61.5], mf: [77, 61.5] }), pie_({ mn: [83, 35], mf: [81, 36] }), 900, 300, 1200, 300) },
    // ---- sustitutos de lluvia ----
    remo_unilateral_lento: { p: { pared: 114 }, db: ['n'], foco: ['brazos', 'torso'], f: ab(incl({ mf: [113, 44] }), incl({ mf: [113, 44], mn: [77, 61] }), 1600, 1000, 2600, 300) },
    remo_unilateral_pausa: { p: { pared: 114 }, db: ['n'], foco: ['brazos', 'torso'], f: ab(incl({ mf: [113, 44] }), incl({ mf: [113, 44], mn: [77, 61] }), 900, 2000, 1200, 300) },
    remo_explosivo: { p: { pared: 114 }, db: ['n'], foco: ['brazos', 'torso'], f: ab(incl({ mf: [113, 44] }), incl({ mf: [113, 44], mn: [77, 61] }), 350, 200, 1100, 400) },
    remo_isometrico: { p: { pared: 114 }, db: ['n'], foco: ['brazos', 'torso'], f: [fr(incl({ mf: [113, 44], mn: [79, 64] }), 1, 0)] },
    remo_inclinado_bilateral: { db: ['n', 'f'], foco: ['brazos', 'torso'], f: ab(incl(), incl({ mn: [77, 61], mf: [75, 61] }), 900, 400, 3000, 300) },
    remo_inclinado_abierto: { db: ['n', 'f'], foco: ['brazos', 'torso'], f: ab(incl(), incl({ mn: [83, 59], mf: [81, 59] }), 900, 400, 1200, 300) },
    encogimientos_mancuerna: { v: 'frente', db: ['n', 'f'], foco: ['torso'], f: ab(frente(), frente({ sy: -4, mn: [91, 56], mf: [69, 56] }), 600, 500, 700, 300) },
    agarre_estatico_mancuernas: { v: 'frente', db: ['n', 'f'], foco: ['brazos'], f: [fr(frente(), 1, 0)] },

  };
  LIB.colgado_activo_cal = LIB.colgado_activo; LIB.dominadas_escapulares = LIB.encogimientos_escap; LIB.hollow_hold_j = LIB.hollow_hold;

  /* ---------- golpes de saco ---------- */
  const SACO = { saco: 1 };
  function golpe(tok) {
    const m = String(tok).trim().match(/^([1-6])(b?)$/i);
    if (!m) {
      const d = String(tok).trim().toUpperCase();
      if (d === 'S') return guardia({ c: [66, 62], t: 74, h: -12 });
      if (d === 'R') return guardia({ c: [62, 68], t: 70, h: -10, pn: [52, 99], pf: [78, 99] });
      if (d === 'P') return guardia({ c: [60, 61], t: 88, pn: [46, 99] });
      return guardia();
    }
    const n = +m[1], cuerpo = !!m[2], dy = cuerpo ? 16 : 0, ex = cuerpo ? { c: [65, 65], t: 78 } : {};
    const lead = n % 2 === 1, lado = lead ? 'f' : 'n', key = lead ? 'mf' : 'mn';
    let p;
    if (n <= 2) p = guardia(X({ t: lead ? 84 : 79, c: lead ? [64, 61] : [67, 61], [key]: [110, 30 + dy] }, ex));
    else if (n <= 4) p = guardia(X({ t: lead ? 82 : 78, c: [66, 61], [key]: [100, 31 + dy], e: lead ? [-1, 1] : [1, -1] }, ex));
    else p = guardia(X({ c: [64, 64], t: 82, [key]: [97, 22 + dy * 0.8], e: lead ? [-1, -1] : [-1, -1] }, ex));
    return X(p, { fo: 1, g: lado, tg: n <= 2 ? 'recto' : n <= 4 ? 'gancho' : 'upper' });
  }
  function combo(code) {
    const partes = String(code).split('-').filter(Boolean);
    const f = [fr(guardia(), 300, 250)];
    partes.forEach(t => { f.push(fr(golpe(t), 150, 110)); f.push(fr(guardia(), 170, 30)); });
    f[f.length - 1].h = 700;
    return { p: SACO, foco: ['brazos'], f };
  }

  /* ---------- buscar figura por id o por nombre ---------- */
  const PALABRAS = [
    [/dead ?bug/i, 'dead_bug'], [/toques? de hombro/i, 'toques_hombro'], [/crunch inverso/i, 'crunch_inverso'], [/bicicleta/i, 'bicicleta'],
    [/plancha lateral con elev/i, 'plancha_lateral_cadera'], [/bird ?dog/i, 'bird_dog'], [/alcance/i, 'plancha_alcance'], [/v-?ups?/i, 'v_ups'],

    [/hollow/i, 'hollow_hold'], [/plancha lateral/i, 'plancha_lateral'], [/plancha|plank/i, 'plank_rkc'], [/limpiaparabrisas/i, 'limpiaparabrisas_suelo'],

    [/typewriter/i, 'typewriter'], [/arquero.*domin|domin.*arquero/i, 'dominadas_arquero'], [/domin.*anch/i, 'dominadas_anchas'],

    [/escapular/i, 'encogimientos_escap'], [/colgad/i, 'colgado_activo'], [/isom[eé]trica/i, 'isometrica_90'], [/domin/i, 'dominadas_pronadas'],
    [/remo/i, 'remo_unilateral'], [/p[aá]jaro/i, 'pajaros'], [/martillo/i, 'curl_martillo'], [/curl de mu[ñn]eca/i, 'curl_muneca'], [/curl/i, 'curl_supino'],
    [/press/i, 'press_unilateral'], [/tr[ií]ceps/i, 'triceps_overhead'], [/laterales/i, 'laterales'], [/encogimiento/i, 'encogimientos_mancuerna'],
    [/granjero/i, 'granjero'], [/maleta/i, 'maleta'], [/sobre la cabeza.*paseo|paseo.*cabeza/i, 'overhead_carry'], [/l-?sit/i, 'lsit_suelo'],
    [/y-?t-?w/i, 'ytw_pie'], [/retracci/i, 'retracciones_escapulares_pie'], [/c[ií]rculos de brazos|movilidad/i, 'movilidad_brazos'], [/sujeci[oó]n|agarre/i, 'agarre_estatico_mancuernas']
  ];
  function clave(id, nombre) {
    if (id && LIB[id]) return id;
    if (nombre) for (const [re, k] of PALABRAS) if (re.test(nombre)) return k;
    return null;
  }
  const cache = {};
  function spec(k) {
    if (!k) return null;
    if (k.startsWith('combo:')) return cache[k] || (cache[k] = combo(k.slice(6)));
    return LIB[k] || null;
  }
  // encuadre automático: viewBox ajustado a todo el recorrido del movimiento
  function caja(sp) {
    if (sp._vb) return sp._vb;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    const poses = [];

    for (const p of poses) {
      for (const m of dibujar(p, sp).matchAll(/<(line|circle|rect)([^>]*)>/g)) {

        if (/class="(pr sl|mat|fx)/.test(a)) continue;

        else if (m[1] === 'circle') { const r = v('r'); add(v('cx') - r, v('cy') - r); add(v('cx') + r, v('cy') + r); }
        else { add(v('x'), v('y')); add(v('x') + v('width'), v('y') + v('height')); }
      }

    for (const e of ents) { if (e.isIntersecting) vivos.set(e.target, 1); else vivos.delete(e.target); }
    if (vivos.size && !raf) raf = requestAnimationFrame(bucle);
  }) : null;
  function montar(raiz = document) {
    raiz.querySelectorAll('svg.fig[data-fig]:not([data-m])').forEach(el => {
      el.dataset.m = 1; el.dataset.t0 = performance.now(); pintar(el, performance.now());
      if (io) io.observe(el); else vivos.set(el, 1);
    });
    if (vivos.size && !raf) raf = requestAnimationFrame(bucle);
  }
  function poner(el, k) {
    if (!el) return;
    const sp = spec(k); el.classList.toggle('hidden', !sp); if (!sp) return;
    el.dataset.fig = k; el.setAttribute('viewBox', caja(sp)); el.dataset.t0 = performance.now(); pintar(el, performance.now());
    vivos.set(el, 1); if (!raf) raf = requestAnimationFrame(bucle);
  }
  return { clave, svg, montar, poner, spec, LIB, golpe, dibujar, poseEn };
})();

/* =========================================================
   5. HISTORIAL Y SUGERENCIAS DE PROGRESIÓN
   ========================================================= */
function historialEj(ejId) {
  const out = [];
  for (const s of S.sesiones) {
    const f = s.fuerza.find(x => x.ejId === ejId);
    if (!f) continue;
    const hechas = f.series.filter(x => x.hecha && x.valor != null);
    if (hechas.length) out.push({ id: s.id, fecha: s.fecha, descarga: s.descarga, rango: f.rango, medida: f.medida, series: hechas });
  }
  return out;
}
function ultimoKg(ejId) {
  for (let i = S.sesiones.length - 1; i >= 0; i--) {
    const f = S.sesiones[i].fuerza.find(x => x.ejId === ejId);
    if (f) { const c = f.series.filter(x => x.kg != null); if (c.length) return c[c.length - 1].kg; }
  }
  return null;
}
const kgMax = r => { const ks = r.series.map(x => x.kg).filter(k => k != null); return ks.length ? Math.max(...ks) : null; };
function textoUltima(ejId) {
  const h = historialEj(ejId); if (!h.length) return null;
  const u = h[h.length - 1]; const k = kgMax(u);
  return fechaCorta(u.fecha) + ': ' + u.series.map(x => x.valor).join(' · ') + (u.medida === 's' ? ' s' : '') + (k ? ' (' + fmtKg(k) + ')' : '');
}
function sugerencia(ej, enDescarga) {
  if (enDescarga) return { tipo: 'info', txt: 'Semana de descarga: misma carga, menos series. Recupera.' };
  const h = historialEj(ej.ejId).filter(x => !x.descarga);
  if (!h.length) return { tipo: 'info', txt: 'Primera vez: busca el rango dejando 1–2 repeticiones en reserva.' };
  const [min, max] = ej.rango;
  const alTope = r => r.series.length > 0 && r.series.every(x => x.valor >= max && (x.rir == null || x.rir >= 1));
  const bajo = r => r.series.some(x => x.valor < min);
  const u = h[h.length - 1], p = h[h.length - 2];
  if (ej.habilidad) {
    if (alTope(u)) return { tipo: 'subir', txt: 'Técnica sólida al tope del rango. ' + (ej.variante ? 'Prueba: ' + ej.variante + '.' : 'Sube la dificultad sin perder calidad.') };
    return { tipo: 'mant', txt: 'Habilidad: calidad ante todo, para antes de la fatiga.' };
  }
  if (p && alTope(u) && alTope(p)) return { tipo: 'subir', txt: '⬆️ ' + textoSubir(ej, u) };
  if (p && bajo(u) && bajo(p)) return { tipo: 'bajar', txt: '⬇️ ' + (ej.medida === 's' ? 'Dos sesiones bajo el rango: acorta la palanca o descansa más.' : (usaKg(ej.carga) && kgMax(u) ? 'Dos sesiones bajo el rango: baja 1–2,5 kg.' : 'Dos sesiones bajo el rango: vuelve a una variante más fácil.')) };
  if (bajo(u)) return { tipo: 'mant', txt: '= Mantén la carga y consolida el rango.' };
  if (alTope(u)) return { tipo: 'casi', txt: '🔥 Llegaste al tope la última vez: si lo repites hoy, en la próxima subes.' };
  return { tipo: 'mant', txt: '= Intenta +1 rep (o +2 s) en alguna serie respecto a la última vez.' };
}
function textoSubir(ej, u) {
  const kg = kgMax(u);
  if (ej.medida === 's') return 'Sube 2–5 s por serie o alarga la palanca.';
  if (ej.carga === 'mancuerna') {
    if (kg != null && kg >= S.ajustes.mancuernaMax) return 'Ya usas ' + S.ajustes.mancuernaMax + ' kg: baja en 3–5 s o añade una pausa de 1–2 s.';
    return 'Sube 1–2,5 kg y vuelve al inicio del rango.';
  }
  if (ej.carga === 'peso_corporal_lastrable') {
    const lim = S.ajustes.lastreMax;
    if (lim != null && kg != null && kg >= lim) return 'Lastre al límite de tu barra (' + lim + ' kg): usa tempo lento o pausa arriba.';
    return 'Añade 1–2,5 kg de lastre' + (ej.variante ? ' (' + ej.variante + ')' : '') + '.';
  }
  return ej.variante ? 'Pasa a: ' + ej.variante + '.' : 'Baja en 3–5 s o añade una pausa de 1–2 s.';
}
function sugeridoSerie(ej, j) {
  const h = historialEj(ej.ejId); const u = h[h.length - 1];
  if (u && u.series[j]) return u.series[j].valor;
  return ej.rango[1];
}
const mejorSerie = series => series.reduce((b, x) => (!b || (x.kg || 0) > (b.kg || 0) || ((x.kg || 0) === (b.kg || 0) && x.valor > b.valor)) ? x : b, null);

const Sonido = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      sesionAudio(Musica.sonando ? 'playback' : 'ambient');
    } catch (e) { }
  },
  tono(f, dur, { tipo = 'sine', vol = 0.3, at = 0 } = {}) {
    if (!S.ajustes.sonido || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  campana(veces = 1) {
    Musica.atenuar(1.2 + veces * 0.45);
    for (let k = 0; k < veces; k++) { const at = k * 0.42; [[660, .35, 1.6], [1320, .14, 1.1], [1822, .09, .8], [3564, .04, .4]].forEach(([f, v, d]) => this.tono(f, d, { vol: v, at })); }
  },
  clack() { Musica.atenuar(0.8); this.tono(1900, 0.05, { tipo: 'square', vol: 0.18 }); this.tono(1700, 0.05, { tipo: 'square', vol: 0.18, at: 0.14 }); },
  pip(alto = false) { Musica.atenuar(0.5); this.tono(alto ? 1320 : 880, 0.13, { vol: 0.32 }); },
  rafaga() { Musica.atenuar(1); [0, 0.12, 0.24].forEach(at => this.tono(1560, 0.08, { tipo: 'square', vol: 0.2, at })); }
};
function sesionAudio(tipo) { try { if (navigator.audioSession) navigator.audioSession.type = tipo; } catch (e) { } }
function vibrar(p) { try { if (S.ajustes.vibracion && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

const Voz = {
  voz: null,
  init() {

/* =========================================================

const DEF = { S: ['Esquiva', 'esquiva'], R: ['Rueda', 'rueda'], P: ['Pivote', 'pivota'] };

}
const VOZ_NUM = { 1: 'uno', 2: 'dos', 3: 'tres', 4: 'cuatro', 5: 'cinco', 6: 'seis' };

/* =========================================================
   8. MÚSICA (tus canciones, guardadas en el celular)
   ========================================================= */
const Musica = {
  audio: new Audio(), lista: [], idx: -1, sonando: false, url: null, gain: null, duckT: null, _db: null,
  db() {
    return this._db ||= new Promise((res, rej) => {
      const r = indexedDB.open('shinobi-musica', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('pistas', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async tx(modo, fn) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const t = db.transaction('pistas', modo); let out; const r = fn(t.objectStore('pistas'));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async cargarLista() {
    try {
      const all = await this.tx('readonly', st => st.getAll());
      this.lista = (all || []).map(p => ({ id: p.id, nombre: p.nombre, tam: p.blob.size, orden: p.orden })).sort((a, b) => a.orden - b.orden);
    } catch (e) { this.lista = []; }
    pintarMusica();
  },
  async agregar(files) {
    let orden = this.lista.length ? Math.max(...this.lista.map(x => x.orden)) + 1 : 0, n = 0;
    for (const f of files) {
      if (!(f.type || '').startsWith('audio') && !/\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name)) continue;
      try { await this.tx('readwrite', st => st.put({ id: uid('t'), nombre: f.name.replace(/\.[^.]+$/, ''), blob: f, orden: orden++ })); n++; }
      catch (e) { toast('No cabe más música en el celular.'); break; }
    }
    await this.cargarLista();
    toast(n ? '♪ ' + n + ' canción(es) añadidas' : 'No se añadió ningún audio');
  },
  async borrar(id) {
    const actual = this.lista[this.idx];
    if (actual && actual.id === id) { this.audio.pause(); this.audio.removeAttribute('src'); this.sonando = false; this.idx = -1; }
    await this.tx('readwrite', st => st.delete(id)); await this.cargarLista();
  },
  conectar() {
    if (this.gain || !Sonido.ctx) return;
    try { const src = Sonido.ctx.createMediaElementSource(this.audio); this.gain = Sonido.ctx.createGain(); src.connect(this.gain).connect(Sonido.ctx.destination); } catch (e) { this.gain = null; }
  },
  setVol(v) {
    if (this.gain) this.gain.gain.setTargetAtTime(v, Sonido.ctx.currentTime, 0.08);
    else this.audio.volume = v;
  },
  async play(i) {
    if (!this.lista.length) { toast('Añade canciones en el reproductor (♪)'); return; }
    Sonido.init(); this.conectar();
    this.idx = ((i % this.lista.length) + this.lista.length) % this.lista.length;
    const p = await this.tx('readonly', st => st.get(this.lista[this.idx].id));
    if (!p) return;
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(p.blob); this.audio.src = this.url;
    this.setVol(S.ajustes.musica.volumen); sesionAudio('playback');
    try { await this.audio.play(); this.sonando = true; } catch (e) { this.sonando = false; }
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: p.nombre, artist: 'RXN KAGE' });
        navigator.mediaSession.setActionHandler('play', () => this.toggle());
        navigator.mediaSession.setActionHandler('pause', () => this.toggle());
        navigator.mediaSession.setActionHandler('nexttrack', () => this.sig());

    }

  toggle() {

    if (this.audio.paused) { this.audio.play().catch(() => { }); this.sonando = true; sesionAudio('playback'); }
    else { this.audio.pause(); this.sonando = false; sesionAudio('ambient'); }

  },
  sig() { const a = S.ajustes.musica.aleatorio && this.lista.length > 1; let i = this.idx + 1; if (a) { do { i = Math.floor(Math.random() * this.lista.length); } while (i === this.idx); } this.play(i); },
  ant() { if (this.audio.currentTime > 4) { this.audio.currentTime = 0; return; } this.play(this.idx - 1); },

/* =========================================================
   9. MOTOR DE TIEMPO
   Usa la hora real (Date.now), así no se desfasa si el
   celular bloquea la pantalla o la app pasa a segundo plano.
   ========================================================= */
const Ticker = {
  subs: new Set(), id: null,
  add(f) { this.subs.add(f); if (!this.id) this.id = setInterval(() => this.run(), 200); },
  del(f) { this.subs.delete(f); if (!this.subs.size && this.id) { clearInterval(this.id); this.id = null; } },
  run() { for (const f of [...this.subs]) { try { f(); } catch (e) { console.error(e); } } }
};

class Secuencia {
  constructor(segs, h = {}) { this.segs = segs; this.h = h; this.i = 0; this.pausado = false; this.fin = false; this.atrasado = false; this.f = () => this.tick(); }
  get seg() { return this.segs[this.i]; }
  ahora() { return this.pausado ? this.pIni : Date.now(); }
  el() { return (this.ahora() - this.t0 - this.pAcc) / 1000; }
  start() { this.i = 0; this.t0 = Date.now(); this.pAcc = 0; this.ult = null; this.h.seg && this.h.seg(this.seg, this); Ticker.add(this.f); this.tick(); }
  tick() {
    if (this.fin) return;
    let s = this.seg;
    while (s && s.dur != null && this.el() >= s.dur) {
      const sobra = this.el() - s.dur; this.atrasado = sobra > 1.5;
      this.avanzar(sobra, true); if (this.fin) return; s = this.seg;
    }
    this.atrasado = false;
    const el = this.el(), rem = s.dur != null ? s.dur - el : null;
    if (rem != null) { const r = Math.ceil(rem); if (r !== this.ult) { this.ult = r; this.h.sec && this.h.sec(s, r, this); } }
    this.h.tick && this.h.tick(s, el, rem, this);
  }
  avanzar(sobra = 0, auto = false) {
    this.h.finSeg && this.h.finSeg(this.seg, this.el(), auto, this);
    this.i++;
    if (this.i >= this.segs.length) { this.terminar(true); return; }
    this.t0 = Date.now() - sobra * 1000; this.pAcc = 0; this.ult = null;
    this.h.seg && this.h.seg(this.seg, this);
  }
  pausar() { if (!this.pausado) { this.pausado = true; this.pIni = Date.now(); } }
  reanudar() { if (this.pausado) { this.pAcc += Date.now() - this.pIni; this.pausado = false; } }
  saltar() { this.reanudar(); this.avanzar(0, false); if (!this.fin) this.tick(); }
  terminar(completo) { if (this.fin) return; if (!completo && this.seg) { this.h.finSeg && this.h.finSeg(this.seg, this.el(), false, this); } this.fin = true; Ticker.del(this.f); this.h.fin && this.h.fin(completo, this); }
}

function timerSaco(ses) {
  const sc = ses.saco, b = P().saco.bloques[sc.bloqueId] || {}, n = sc.asaltosPlan, A = S.ajustes;
  const combos = (b.combos || []).filter(Boolean);
  const segs = [{ tipo: 'prep', dur: A.preparacion, etq: 'PREPÁRATE', info: (sc.modo === 'sombra' ? 'Sombra · ' : '') + 'Asalto 1 de ' + n, fig: 'combo:' }];
  for (let r = 1; r <= n; r++) {
    segs.push({ tipo: 'work', dur: sc.asaltoS, ronda: r, total: n, etq: 'ASALTO ' + r, info: b.foco || '', fig: 'combo:' });
    if (r < n) segs.push({ tipo: 'rest', dur: sc.descansoS, ronda: r, total: n, etq: 'DESCANSO', info: 'Siguiente: asalto ' + (r + 1) + ' de ' + n });
  }
  let prox = 3, ult = null, enR = false;
  const raf = b.rafagas;
  Timer.abrir({
    titulo: (sc.modo === 'sombra' ? '🌧️ Sombra · ' : '🥊 ') + (b.nombre || 'Saco'), segs,
    finTxt: 'Registra tu RPE y los combos que trabajaste.',
    hooks: {
      seg: (s, sq) => {
        if (s.tipo === 'work') { prox = rnd(2.5, 4); enR = false; }
        if (sq.atrasado) return;
        if (s.tipo === 'prep') { Voz.decir('Prepárate'); }
        if (s.tipo === 'work') { Sonido.campana(1); vibrar(400); }
        if (s.tipo === 'rest') { Sonido.campana(3); vibrar([300, 150, 300]); Voz.decir('Descanso. Respira.'); }
      },
      sec: (s, r, sq) => {
        if (sq.atrasado) return;
        if (s.tipo === 'work' && r === A.avisoFinal && s.dur > A.avisoFinal + 5) { Sonido.clack(); vibrar([60, 60, 60]); }
        if ((s.tipo === 'rest' || s.tipo === 'prep') && r <= 3 && r > 0) Sonido.pip(r === 1);
      },
      tick: (s, el, rem) => {
        if (s.tipo !== 'work') return;
        if (raf && raf.cada_s) {
          const ahora = (el % raf.cada_s) >= (raf.cada_s - raf.trabajo_s) && rem > 0.5;
          if (ahora && !enR) { Sonido.rafaga(); vibrar([100, 50, 100]); Voz.decir('¡Ráfaga!'); $('#timer').dataset.e = 'rafaga'; Timer.combo('RÁFAGA', 'Máxima velocidad, golpes rectos'); Fig.poner($('#tmFig'), 'combo:1-2-1-2-1-2'); }
          if (!ahora && enR) { $('#timer').dataset.e = rem <= A.avisoFinal ? 'warn' : 'work'; Timer.combo('', ''); if (rem > 3) Voz.decir('Técnica'); prox = el + rnd(2, 3); }
          enR = ahora; if (enR) return;
        }
        if (combos.length && S.ajustes.voz && el >= prox && rem > 3) {
          let c; do { c = combos[Math.floor(Math.random() * combos.length)]; } while (combos.length > 1 && c === ult);
          ult = c; Timer.combo(c, comboNombre(c)); Fig.poner($('#tmFig'), 'combo:' + c);
          sc.llamados[c] = (sc.llamados[c] || 0) + 1;
          Voz.decir(comboVoz(c));
          prox = el + rnd(A.voz.min, A.voz.max);
        }
      },
      finSeg: (s, el) => { if (s.tipo === 'work' && el >= s.dur * 0.6) { sc.hechos = (sc.hechos || 0) + 1; } },
      fin: (completo) => {
        Sonido.campana(3); vibrar([400, 150, 400]); if (completo) Voz.decir('Terminado. Buen trabajo.');
        sc.asaltosHechos = Math.min(sc.asaltosPlan, sc.hechos || 0); delete sc.hechos; sc.terminado = true;
        if (!sc.combos.length) sc.combos = Object.keys(sc.llamados);
        guardar();
      }
    }
  });
}

function timerAbs(ses) {

/* ---------- Dock: descanso entre series y cronómetro ---------- */
const Dock = {
  modo: null, f: null,
  init() { this.f = () => this.tick(); },
  descanso(seg, siguiente) { this.modo = 'desc'; this.total = seg; this.fin = Date.now() + seg * 1000; this.sig = siguiente; this.avisado = false; this.ult = null; Ticker.add(this.f); this.tick(); },
  crono(e, s) {
    const ej = S.activa.fuerza[e];
    this.modo = 'crono'; this.ref = { e, s }; this.ini = Date.now(); this.rango = ej.rango; this.nombre = ej.nombre; this.ult = -1;
    Sonido.init(); Sonido.pip(true); Ticker.add(this.f); this.tick();
  },
  ajustar(d) { if (this.modo === 'desc') { this.fin += d * 1000; this.total = Math.max(this.total + d, 1); this.avisado = false; this.tick(); } },
  cerrar() {
    if (this.modo === 'crono' && S.activa) {
      const seg = Math.round((Date.now() - this.ini) / 1000), { e, s } = this.ref;
      const se = S.activa.fuerza[e] && S.activa.fuerza[e].series[s];
      if (se) { se.valor = seg; guardar(); toast('⏱ ' + seg + ' s anotados'); }
      this.modo = null; Ticker.del(this.f); $('#barDock').classList.add('hidden'); render(); return;
    }
    this.modo = null; Ticker.del(this.f); $('#barDock').classList.add('hidden');
  },
  tick() {
    const bar = $('#barDock');
    if (this.modo === 'desc') {
      const rem = (this.fin - Date.now()) / 1000, r = Math.ceil(rem);
      if (r !== this.ult) { this.ult = r; if (r <= 3 && r > 0) Sonido.pip(false); }
      if (rem <= 0 && !this.avisado) { this.avisado = true; Sonido.campana(2); vibrar([300, 120, 300]); Voz.decir('A trabajar'); setTimeout(() => { if (this.modo === 'desc' && this.avisado) this.cerrar(); }, 8000); }
      const go = rem <= 0;
      bar.classList.remove('hidden');
      bar.innerHTML = `<div class="bar ${go ? 'go' : 'rest'}"><div class="big">${go ? '¡Ya!' : fmt(r)}</div>
        <div class="txt"><div class="b">${go ? 'A trabajar' : 'Descanso'}</div><div class="ell mut">${esc(this.sig || '')}</div><div class="prog"><i style="width:${Math.min(100, (1 - Math.max(rem, 0) / this.total) * 100)}%"></i></div></div>
        ${go ? '' : '<button data-act="dock-adj" data-d="-15">−15</button><button data-act="dock-adj" data-d="15">+15</button>'}<button data-act="dock-cerrar" aria-label="Cerrar">✕</button></div>`;
    } else if (this.modo === 'crono') {
      const el = (Date.now() - this.ini) / 1000, s = Math.floor(el), [mn, mx] = this.rango;
      if (s !== this.ult) { this.ult = s; if (s === mn) { Sonido.pip(true); vibrar(150); } if (s === mx) { Sonido.campana(1); vibrar([200, 100, 200]); Voz.decir('Tiempo'); } }
      const col = s >= mx ? 'go' : 'crono';
      bar.classList.remove('hidden');
      bar.innerHTML = `<div class="bar ${col}"><div class="big">${s} s</div><div class="txt"><div class="b ell">${esc(this.nombre)}</div><div class="mut">Objetivo ${rangoTxt(this.rango, 's')}</div>
        <div class="prog"><i style="width:${Math.min(100, (el / mx) * 100)}%"></i></div></div><button data-act="dock-cerrar" style="background:var(--or);border-color:var(--or)">Parar</button></div>`;
    }
  }
};

    return { id: r.id, nombre: r.nombre, det: r.medida === 'libre' ? '' : det, hecho: false };

const PASOS = [['cal', 'Calentamiento'], ['fuerza', 'Fuerza'], ['saco', 'Saco'], ['abs', 'Abdomen'], ['resumen', 'Resumen']];
function pasoHecho(s, p) {
  if (p === 'cal') return s.cal.every(x => x.hecho);
  if (p === 'fuerza') return s.fuerza.every(e => e.series.every(x => x.hecha));
  if (p === 'saco') return s.saco.terminado;
  if (p === 'abs') return !!s.abs && s.abs.rondasHechas >= s.abs.rondasPlan;
  return false;
}
function siguienteSerie(s) {
  for (const e of s.fuerza) for (const x of e.series) if (!x.hecha) return e.nombre + ' · serie ' + x.n;
  return 'Fuerza completada → saco';
}
function statsSesion(s) {
  let hechas = 0, total = 0, reps = 0, seg = 0;
  for (const e of s.fuerza) for (const x of e.series) { total++; if (x.hecha) { hechas++; if (e.medida === 's') seg += x.valor || 0; else reps += x.valor || 0; } }
  const sacoMin = (s.saco.asaltosHechos * s.saco.asaltoS + (s.saco.desahogoS || 0)) / 60;
  return { hechas, total, reps, seg, sacoMin, dur: (s.fin || Date.now()) - s.inicio };

/* ---------- Calorías (estimación) ----------
   kcal = MET × peso (kg) × horas, calculado bloque por bloque.
   MET del Compendio de Actividades Físicas 2024 (Herrmann, Ainsworth et al.):
   calistenia intensa 7,5 · moderada 3,8 · ligera (planchas, abdominales) 2,8 ·
   entrenamiento con pesas, varios ejercicios 3,5 · circuito intenso 8,0 ·
   saco: general 5,8 · 60 golpes/min 7,0 · 120 golpes/min 8,5 · de pie en reposo 1,3. */
const MET = { calistenia: 7.5, moderada: 3.8, ligera: 2.8, pesas: 3.5, circuito: 8.0, sacoSuave: 5.8, sacoMedio: 7.0, sacoFuerte: 8.5, reposo: 1.3 };
function pesoPara(s) {
  if (s && s.peso) return s.peso;
  if (S.pesos.length) return S.pesos[S.pesos.length - 1].kg;
  return S.ajustes.pesoBase || null;
}
function segPorRep(e) {
  const t = String(e.tempo || '').split('-').map(Number).filter(n => !isNaN(n));
  if (t.length >= 2) return Math.max(2, t.reduce((a, b) => a + b, 0));
  return e.habilidad ? 2 : 3;
}
function calorias(s, kgForzado) {
  const kg = kgForzado || pesoPara(s); if (!kg) return null;
  const k = (met, seg) => met * kg * (seg / 3600);
  const P_ = { cal: 0, fuerza: 0, emom: 0, saco: 0, abs: 0 };
  // calentamiento: 10 min de calistenia ligera, proporcional a lo marcado
  const nc = s.cal.length ? s.cal.filter(c => c.hecho).length / s.cal.length : 0;
  P_.cal = k(MET.ligera, 600 * nc);
  // fuerza: tiempo real de trabajo de cada serie + descansos
  let nSeries = 0;
  for (const e of s.fuerza) for (const x of e.series) {
    if (!x.hecha || x.valor == null) continue; nSeries++;
    const lados = e.porLado ? 2 : 1;

    const top = Object.entries(cc).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const moods = [...S.sesiones.map(s => s.saco), ...S.extras].filter(x => x.animoAntes && x.animoDespues);
    const dm = moods.length ? moods.reduce((a, x) => a + (x.animoDespues - x.animoAntes), 0) / moods.length : null;
    h += `<div class="grid3" style="margin-bottom:12px"><div class="stat"><div class="v">${asaltos}</div><div class="l">Asaltos totales</div></div><div class="stat"><div class="v">${rpes.length ? (rpes.reduce((a, b) => a + b, 0) / rpes.length).toFixed(1) : '–'}</div><div class="l">RPE medio (4 sem.)</div></div>
      <div class="stat"><div class="v">${dm == null ? '–' : (dm >= 0 ? '+' : '') + dm.toFixed(1)}</div><div class="l">Ánimo tras desahogo</div></div></div>
      <div class="card"><h3>Minutos en el saco por semana</h3>${grafBarras(ws.map(w => w.et), [{ nombre: 'Asaltos', color: '#F26B1D', vals: sacoV }, { nombre: 'Desahogo', color: '#7C5CF0', vals: desV }], { suf: ' min' })}</div>
      <div class="card"><h3>Combinaciones más trabajadas</h3>${top.length ? top.map(([c, n]) => `<div class="set-line"><span><b>${esc(c)}</b> <span class="mut sm">${esc(comboNombre(c))}</span></span><span class="chip">${n}×</span></div>`).join('') : '<p class="mut sm">Marca los combos que trabajas en cada sesión.</p>'}</div>`;
  } else {
    const pts = S.pesos.map(p => ({ x: p.fecha, y: p.kg })), rg = rangoActual();
    h += `<div class="card"><div class="row sb"><h3>Rango shinobi</h3><button class="btn sm" data-act="tests">Registrar tests</button></div>
      <p style="margin:6px 0 10px">${rg ? '<span class="stars">' + '✦'.repeat(P().ciclo.rangos.indexOf(rg) + 1) + '</span> <b>' + esc(rg.nombre) + '</b>' : '<span class="mut">Aún sin rango. Registra tus tests al final del ciclo.</span>'}</p>
      ${P().ciclo.rangos.map(g => `<div class="set-line"><span><b>${esc(g.nombre)}</b></span><span class="mut sm">${Object.entries(g.metas).map(([k, v]) => { const t = P().ciclo.tests_fin_ciclo.find(x => x.id === k); return esc(t ? t.nombre.replace('Máx. ', '') : k) + ' ' + v + (t && t.medida === 's' ? ' s' : ''); }).join(' · ')}</span></div>`).join('')}</div>`;
    if (S.tests.length) {
      const T = P().ciclo.tests_fin_ciclo;
      h += `<div class="card"><h3>Tests</h3><div style="overflow-x:auto"><table class="tbl"><tr><th>Fecha</th>${T.map(t => '<th>' + esc(t.nombre.replace('Máx. ', '')) + '</th>').join('')}<th></th></tr>
        ${[...S.tests].reverse().map(t => `<tr><td>${fechaCorta(t.fecha)}</td>${T.map(x => '<td>' + (t.resultados[x.id] ?? '–') + '</td>').join('')}<td><button class="btn sm ghost" data-act="borrar-test" data-id="${t.id}">🗑</button></td></tr>`).join('')}</table></div></div>`;
    }
    h += `<div class="card"><div class="row sb"><h3>Peso corporal</h3><button class="btn sm ghost" data-act="peso-nuevo">+ Anotar</button></div>${grafLinea(pts, { color: '#2A9D8F', suf: ' kg' })}</div>`;
  }
  return h;
}

/* ---------- Modales ---------- */
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="box">${html}</div>`; m.classList.remove('hidden'); Fig.montar(m); }
function cerrarModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function confirmar(txt, si, { ok = 'Sí', peligro = false } = {}) {
  modal(`<h2>${esc(txt)}</h2><div class="grid2" style="margin-top:14px"><button class="btn ghost" data-act="cerrar-modal">Cancelar</button><button class="btn ${peligro ? 'danger' : ''}" id="mOk">${esc(ok)}</button></div>`);
  $('#mOk').onclick = () => { cerrarModal(); si(); };
}
function pedirAnimo(titulo, cb) {
  if (!S.ajustes.desahogo.animo) { cb(null); return; }
  modal(`<h2>${esc(titulo)}</h2><div class="moods">${MOODS.map((m, i) => `<button data-mood="${i + 1}">${m[0]}<small>${m[1]}</small></button>`).join('')}</div>
    <button class="btn ghost full" style="margin-top:12px" data-mood="0">Omitir</button>`);
  $('#modal').querySelectorAll('[data-mood]').forEach(b => b.onclick = () => { cerrarModal(); cb(+b.dataset.mood || null); });
}
function flujoDesahogo(enSesion) {
  const dur = S.ajustes.desahogo.duracion || null;
  pedirAnimo('¿Cómo llegas?', antes => {
    timerDesahogo({
      dur, alTerminar: seg => {
        if (!seg) return;
        pedirAnimo('¿Y cómo sales?', despues => {
          if (enSesion && S.activa) { const sc = S.activa.saco; sc.desahogoS = (sc.desahogoS || 0) + seg; if (antes) sc.animoAntes = antes; if (despues) sc.animoDespues = despues; }
          else { const x = { id: uid('x'), tipo: 'desahogo', fecha: isoLocal(), ts: Date.now(), segundos: seg, animoAntes: antes, animoDespues: despues }; x.kcal = kcalExtra(x); S.extras.push(x); }
          guardar(); render(); toast('💥 Desahogo registrado: ' + fmt(seg));
        });
      }
    });
  });
}
function modalTests() {
  const T = P().ciclo.tests_fin_ciclo;
  modal(`<h2>📋 Tests de fin de ciclo</h2><p class="mut sm" style="margin:0 0 6px">Descansado y con buena técnica. Deja vacío lo que no midas.</p><form id="fTest">
    ${T.map(t => `<label class="f">${esc(t.nombre)} (${t.medida === 's' ? 'segundos' : 'reps'})</label><input class="inp" type="number" inputmode="numeric" name="${t.id}">`).join('')}
    <div class="mbar"><button type="button" class="btn ghost" data-act="cerrar-modal">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>`);
  $('#fTest').addEventListener('submit', ev => {
    ev.preventDefault(); const f = new FormData(ev.target), res = {};
    T.forEach(t => { const v = num(f.get(t.id)); if (v != null) res[t.id] = v; });
    if (!Object.keys(res).length) { cerrarModal(); return; }
    const antes = rangoActual(), { semana, ciclo } = semanaCiclo();
    S.tests.push({ id: uid('test'), fecha: isoLocal(), semana, ciclo, resultados: res }); guardar(); cerrarModal();
    const ahora = rangoActual();
    if (ahora && ahora !== antes && (!antes || P().ciclo.rangos.indexOf(ahora) > P().ciclo.rangos.indexOf(antes))) modal(`<div class="c"><div style="font-size:54px">🥷</div><h2>¡Nuevo rango: ${esc(ahora.nombre)}!</h2><p class="mut">Sigue así, shinobi.</p><button class="btn full" data-act="cerrar-modal">Continuar</button></div>`);
    else toast('Tests guardados');
    UI.vista = 'progreso'; UI.vprog = 'cuerpo'; render();
  });
}
