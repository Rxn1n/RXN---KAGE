  const L = Musica.lista;
  modal(`<div class="mus-panel"><div class="row sb"><h2>♪ Tu música</h2><button class="btn sm ghost" data-act="cerrar-modal">Cerrar</button></div>
    <p class="mut sm" style="margin:0 0 10px">Añade canciones (MP3/M4A) desde tu celular: quedan guardadas y suenan sin internet. Durante la campana y los combos la música baja sola.</p>
    <div class="row" style="justify-content:center;gap:10px;margin:6px 0 12px"><button class="btn ghost" data-act="mus-ant">⏮</button><button class="btn" style="min-width:90px" data-act="mus-toggle">${Musica.sonando ? '⏸ Pausa' : '▶ Play'}</button><button class="btn ghost" data-act="mus-sig">⏭</button></div>
    ${L.length ? L.map((t, i) => `<div class="trk ${i === Musica.idx ? 'on' : ''}"><button class="btn sm ghost" data-act="mus-play" data-i="${i}">${i === Musica.idx && Musica.sonando ? '♪' : '▶'}</button><span class="nm">${esc(t.nombre)}</span><span class="mut xs">${(t.tam / 1048576).toFixed(1)} MB</span><button class="btn sm ghost" data-act="mus-borrar" data-id="${t.id}">🗑</button></div>`).join('') : '<div class="empty">Aún no has añadido canciones.</div>'}
    <button class="btn full" style="margin-top:12px" data-act="mus-add">+ Añadir canciones</button>
    <p class="mut xs" style="margin:10px 0 0">¿Prefieres Spotify u otra app? Ábrela de fondo: la campana y la voz suenan por encima.</p></div>`);
}

/* =========================================================
   12. COPIAS DE SEGURIDAD
   ========================================================= */
async function compartirArchivo(nombre, contenido, tipo) {
  const blob = new Blob([contenido], { type: tipo });
  try {
    const file = new File([blob], nombre, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
}
async function exportar() {
  const datos = JSON.stringify({ app: 'rxn-kage', version: APP_VERSION, exportado: new Date().toISOString(), datos: S }, null, 1);
  if (await compartirArchivo('rxn-kage-copia-' + isoLocal() + '.json', datos, 'application/json')) { S.ajustes.ultimaCopia = new Date().toISOString(); guardar(); render(); toast('💾 Copia exportada'); }
}
function exportarCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const filas = [['fecha', 'mision', 'dia', 'semana_ciclo', 'lluvia', 'kcal_sesion', 'ejercicio', 'serie', 'valor', 'medida', 'kg', 'rir', 'hecha'].join(',')];
  for (const s of S.sesiones) for (const e of s.fuerza) for (const x of e.series) filas.push([s.fecha, s.mision, q(s.nombreDia), s.semana, s.lluvia ? 1 : 0, (kcalDe(s) || {}).total ?? '', q(e.nombre), x.n, x.valor ?? '', e.medida, x.kg ?? '', x.rir ?? '', x.hecha ? 1 : 0].join(','));
  compartirArchivo('rxn-kage-series-' + isoLocal() + '.csv', '﻿' + filas.join('\n'), 'text/csv');
}
function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), d = o && (o.app === 'rxn-kage' || o.app === 'shinobi') ? o.datos : null;
      if (!d || d.v !== 1 || !Array.isArray(d.sesiones)) throw new Error('formato');
      confirmar('¿Reemplazar tus datos actuales por esta copia (' + d.sesiones.length + ' misiones)?', () => { S = normalizar(d); guardar(); UI.vista = 'hoy'; render(); toast('✅ Copia restaurada'); }, { ok: 'Reemplazar', peligro: true });
    } catch (e) { toast('Ese archivo no es una copia válida de RXN KAGE'); }
  };
  r.readAsText(file);
}

/* =========================================================
   13. EVENTOS
   ========================================================= */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

const ACT = {
  nav: d => { UI.vista = d.v; if (d.v === 'hoy' && S.activa) UI.vista = 'sesion'; window.scrollTo(0, 0); render(); },
  'dia-sel': d => { UI.diaSel = d.id; render(); },
  empezar: d => { if (S.activa) return; S.activa = crearSesion(d.id, UI.lluvia); guardar(); UI.vista = 'sesion'; UI.diaSel = null; Voz.decir('Misión ' + S.activa.mision + '. ' + S.activa.nombreDia); Wake.on(); window.scrollTo(0, 0); render(); },
  paso: d => { S.activa.paso = d.p; guardar(); window.scrollTo(0, 0); render(); },
  'cal-todo': () => { S.activa.cal.forEach(c => c.hecho = true); guardar(); render(); },
  serie: d => {
    const s = S.activa, e = s.fuerza[+d.e], x = e.series[+d.s];
    if (x.hecha) { x.hecha = false; guardar(); render(); return; }
    if (x.valor == null) x.valor = sugeridoSerie(e, +d.s);
    x.hecha = true; guardar(); vibrar(40);
    const queda = s.fuerza.some(f => f.series.some(y => !y.hecha));
    if (queda) Dock.descanso(e.descanso, 'Siguiente: ' + siguienteSerie(s)); else { Dock.cerrar(); toast('💪 Fuerza completada'); }
    render();
  },
  crono: d => Dock.crono(+d.e, +d.s),
  'dock-adj': d => Dock.ajustar(+d.d),
  'dock-cerrar': () => Dock.cerrar(),
  emom: () => timerEmom(S.activa),
  'saco-adj': d => {
    const sc = S.activa.saco, k = d.k, s = +d.d;
    if (k === 'asaltosPlan') sc.asaltosPlan = Math.min(20, Math.max(1, sc.asaltosPlan + s));
    if (k === 'asaltoS') sc.asaltoS = Math.min(600, Math.max(30, sc.asaltoS + 30 * s));
    if (k === 'descansoS') sc.descansoS = Math.min(300, Math.max(15, sc.descansoS + 15 * s));
    if (k === 'asaltosHechos') { sc.asaltosHechos = Math.min(sc.asaltosPlan, Math.max(0, sc.asaltosHechos + s)); sc.terminado = sc.terminado || sc.asaltosHechos > 0; }
    guardar(); render();
  },
  'saco-start': () => { Dock.cerrar(); S.activa.saco.llamados = S.activa.saco.llamados || {}; timerSaco(S.activa); },
  'combo-tg': d => { const sc = S.activa.saco, c = d.c; sc.combos = sc.combos.includes(c) ? sc.combos.filter(x => x !== c) : [...sc.combos, c]; guardar(); render(); },
  rpe: d => { S.activa.saco.rpe = +d.n; guardar(); render(); },
  'des-dur': d => { S.ajustes.desahogo.duracion = +d.v; guardar(); render(); },
  desahogo: () => flujoDesahogo(true),
  'desahogo-rapido': () => flujoDesahogo(false),
  'abs-adj': d => { const a = S.activa.abs, s = +d.d; if (d.k === 'rondasPlan') a.rondasPlan = Math.min(10, Math.max(1, a.rondasPlan + s)); else a.rondasHechas = Math.min(a.rondasPlan, Math.max(0, a.rondasHechas + s)); guardar(); render(); },
  'abs-start': () => { Dock.cerrar(); timerAbs(S.activa); },
  terminar: () => terminarSesion(),
  descartar: () => confirmar('¿Descartar esta misión? No se guardará nada.', () => { S.activa = null; guardar(); Dock.cerrar(); Wake.revisar(); UI.vista = 'hoy'; render(); }, { ok: 'Descartar', peligro: true }),
  'tm-pausa': () => { const sq = Timer.sq; if (!sq || sq.fin) return; if (sq.pausado) { sq.reanudar(); $('#tmPausa').textContent = 'Pausa'; } else { sq.pausar(); $('#tmPausa').textContent = 'Seguir ▶'; try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } } },
  'tm-saltar': () => { const sq = Timer.sq; if (sq && !sq.fin) sq.saltar(); },
  'tm-hecho': () => { const sq = Timer.sq; if (sq && !sq.fin) sq.saltar(); },
  'tm-cerrar': () => { const sq = Timer.sq; if (!sq || sq.fin) { Timer.salir(); return; } sq.pausar(); confirmar('¿Terminar el temporizador ahora?', () => { sq.reanudar(); sq.terminar(false); Timer.salir(); }, { ok: 'Terminar' }); $('#modal .btn.ghost').onclick = () => { cerrarModal(); sq.reanudar(); }; },
  'tm-salir': () => Timer.salir(),
  detalle: d => { UI.vista = 'detalle'; UI.detalle = d.id; window.scrollTo(0, 0); render(); },
  'borrar-sesion': d => confirmar('¿Eliminar esta misión del historial?', () => { S.sesiones = S.sesiones.filter(s => s.id !== d.id); guardar(); UI.vista = 'historial'; render(); }, { ok: 'Eliminar', peligro: true }),
  'borrar-extra': d => confirmar('¿Eliminar este desahogo?', () => { S.extras = S.extras.filter(x => x.id !== d.id); guardar(); render(); }, { ok: 'Eliminar', peligro: true }),
  'borrar-test': d => confirmar('¿Eliminar este test?', () => { S.tests = S.tests.filter(x => x.id !== d.id); guardar(); render(); }, { ok: 'Eliminar', peligro: true }),
  vprog: d => { UI.vprog = d.k; render(); },
  tests: () => modalTests(),
  'peso-nuevo': () => {
    modal(`<h2>Peso corporal</h2><form id="fPeso"><input class="inp" type="number" inputmode="decimal" step="0.1" name="kg" placeholder="kg" required><div class="mbar"><button type="button" class="btn ghost" data-act="cerrar-modal">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>`);
    $('#fPeso').addEventListener('submit', ev => { ev.preventDefault(); const kg = num(new FormData(ev.target).get('kg')); if (kg) { S.pesos = S.pesos.filter(p => p.fecha !== isoLocal()); S.pesos.push({ fecha: isoLocal(), kg }); S.pesos.sort((a, b) => a.fecha.localeCompare(b.fecha)); guardar(); } cerrarModal(); render(); });
  },
  'ciclo-hoy': () => confirmar('¿Empezar el ciclo 1, semana 1, esta semana?', () => { S.ajustes.inicioCiclo = isoLocal(lunesDe(new Date())); guardar(); render(); toast('Ciclo reiniciado'); }),
  'probar-voz': () => { Sonido.init(); const c = '1-2-3b'; Voz.decir(comboVoz(c)); toast(c + ' → ' + comboNombre(c)); },
  'probar-campana': () => { Sonido.init(); Sonido.campana(1); },
  exportar: () => exportar(),
  csv: () => exportarCSV(),
  importar: () => $('#fileImport').click(),
  'borrar-todo': () => confirmar('¿Borrar TODOS tus datos? Esto no se puede deshacer.', () => confirmar('¿Seguro? Exporta una copia antes si la quieres.', () => { const prog = S.programa; S = normalizar(estadoNuevo()); S.programa = prog; guardar(); UI.vista = 'hoy'; render(); toast('Datos borrados'); }, { ok: 'Borrar todo', peligro: true }), { ok: 'Continuar', peligro: true }),
  'abrir-musica': () => modalMusica(),
  'mus-toggle': () => Musica.toggle(),
  'mus-sig': () => Musica.sig(),
  'mus-ant': () => Musica.ant(),
  'mus-play': d => Musica.play(+d.i),
  'mus-add': () => $('#fileMusica').click(),
  'mus-borrar': d => Musica.borrar(d.id),
  'cerrar-modal': () => cerrarModal(),
  vplan: d => { UI.vplan = d.k; render(); },
  'plan-dia': d => { UI.planDia = d.id; render(); },
  'ej-editar': d => modalEjercicio(+d.i),
  'ej-borrar': d => { const dia = diaPorId(UI.planDia); confirmar('¿Quitar «' + dia.fuerza[+d.i].nombre + '» del plan?', () => { dia.fuerza.splice(+d.i, 1); guardar(); render(); }, { ok: 'Quitar', peligro: true }); },
  'ej-mover': d => { const f = diaPorId(UI.planDia).fuerza, i = +d.i, j = i + +d.d; if (j < 0 || j >= f.length) return; [f[i], f[j]] = [f[j], f[i]]; guardar(); render(); },
  'abs-ej-borrar': d => { P().abdomen.rutinas[d.k].ejercicios.splice(+d.i, 1); guardar(); render(); },
  'abs-ej-nuevo': d => { P().abdomen.rutinas[d.k].ejercicios.push({ nombre: 'Nuevo ejercicio', medida: 'reps', objetivo: 10 }); guardar(); render(); },
  'plan-reset': () => confirmar('¿Restaurar el plan original? Perderás tus cambios en el plan (no tu historial).', () => { const g = P().saco.guardia; S.programa = clone(PROGRAMA_DEF); S.programa.saco.guardia = g; guardar(); render(); toast('Plan restaurado'); }, { ok: 'Restaurar', peligro: true }),
  actualizar: () => { if (UI.updateListo) UI.updateListo.postMessage('SKIP_WAITING'); }
};

document.addEventListener('click', e => {
  Sonido.init();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in && S.activa) {
    const x = S.activa.fuerza[+el.dataset.e].series[+el.dataset.s], k = el.dataset.in;
    x[k] = k === 'rir' ? (el.value === '' ? null : +el.value) : num(el.value);
    if (k === 'kg' && x.kg != null && S.ajustes.lastreMax != null && S.activa.fuerza[+el.dataset.e].carga === 'peso_corporal_lastrable' && x.kg > S.ajustes.lastreMax) toast('⚠️ Supera el límite de lastre de tu barra (' + S.ajustes.lastreMax + ' kg)');
    guardar(); return;
  }
  if (el.dataset.hin) {
    const s = S.sesiones.find(x => x.id === UI.detalle); if (!s) return;
    const x = s.fuerza[+el.dataset.e].series[+el.dataset.s], k = el.dataset.hin;
    x[k] = k === 'hecha' ? el.checked : num(el.value); guardar(); return;
  }
  if (el.dataset.cal != null && S.activa) { S.activa.cal[+el.dataset.cal].hecho = el.checked; guardar(); return; }
  if (el.hasAttribute('data-lluvia')) { UI.lluvia = el.checked; render(); return; }
  if (el.hasAttribute('data-peso') && S.activa) { S.activa.peso = num(el.value); guardar(); render(); return; }
  if (el.hasAttribute('data-progej')) { UI.progEj = el.value; render(); return; }
  if (el.dataset.aj) {
    const cur = getPath(S.ajustes, el.dataset.aj);
    let v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range') ? num(el.value) : el.value;
    if (el.type === 'number' && v == null && el.dataset.aj !== 'lastreMax' && el.dataset.aj !== 'pesoBase') v = cur;
    setPath(S.ajustes, el.dataset.aj, v);
    if (el.dataset.aj.startsWith('musica.volumen') && Musica.sonando) Musica.setVol(S.ajustes.musica.volumen);
    guardar(); if (UI.vista === 'sesion') render(); return;
  }
  if (el.dataset.pg) { setPath(S.programa, el.dataset.pg, el.value); guardar(); return; }
  if (el.dataset.pd) { diaPorId(UI.planDia)[el.dataset.pd] = el.value; guardar(); return; }
  if (el.dataset.pb) {
    const [k, campo] = el.dataset.pb.split('.'), b = P().saco.bloques[k];
    b[campo] = campo === 'combos' ? el.value.split(/\n|,/).map(x => x.trim()).filter(Boolean) : ['asaltos', 'asalto_s', 'descanso_s'].includes(campo) ? Math.max(1, num(el.value) || 1) : el.value;
    guardar(); return;
  }
  if (el.dataset.pa) {
    const [k, ...rest] = el.dataset.pa.split('.'), r = P().abdomen.rutinas[k], path = rest.join('.');
    const v = /(objetivo|rondas)$/.test(path) ? Math.max(1, num(el.value) || 1) : el.value;
    setPath(r, path, v); guardar(); return;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.txt && S.activa) { setPath(S.activa, el.dataset.txt, el.value); guardar(); }
});
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) importar(f); e.target.value = ''; });
$('#fileMusica').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) { toast('Guardando música…'); Musica.agregar(fs); } });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrarModal(); });

/* =========================================================
   14. ARRANQUE + modo sin conexión (service worker)
   ========================================================= */
cargar(); Dock.init(); Voz.init(); render(); Musica.cargarLista();
if (S.activa) Wake.on();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const avisar = w => { UI.updateListo = w; if (UI.vista === 'hoy') render(); };
    if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); }); });
  }).catch(() => { });
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargando && UI.updateListo) { recargando = true; location.reload(); } });
}
</script>
